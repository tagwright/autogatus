[project]
name = "autogatus"
version = "0.1.0"
description = "Docker-label service discovery for Gatus. Autokuma, but for Gatus."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["docker>=7.0.0", "PyYAML>=6.0"]

[project.scripts]
autogatus = "autogatus.__main__:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
# web.py composes HTML string fragments (Tailwind class lists, inline templates);
# wrapping them to satisfy the line limit hurts readability and, inside the
# triple-quoted blocks, would inject newlines into the rendered output.
"autogatus/web.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["autogatus"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
