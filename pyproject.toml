[project]
name = "autogatus"
version = "0.1.0"
description = "Docker-label service discovery for Gatus. Autokuma, but for Gatus."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["docker>=7.0.0", "PyYAML>=6.0"]

[project.scripts]
autogatus = "autogatus.__main__:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
