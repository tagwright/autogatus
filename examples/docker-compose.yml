# Example: run autogatus alongside Gatus, sharing a volume for the generated
# config. Gatus reads /config (its base) plus /config/generated (autogatus
# output); it merges every *.yaml it finds and hot-reloads on change.

services:
  gatus:
    image: ghcr.io/twin/gatus:stable
    environment:
      GATUS_CONFIG_PATH: /config     # a directory: base + generated are merged
    volumes:
      - ./config:/config:ro                    # your hand-written base config
      - gatus-generated:/config/generated:ro   # autogatus writes here
    ports:
      - "8080:8080"

  autogatus:
    image: ghcr.io/techgaud/autogatus:latest   # or build: ..
    restart: unless-stopped
    environment:
      AUTOGATUS_OUTPUT: /output/autogatus.yaml
      AUTOGATUS_DEFAULT_GROUP: ""              # empty = group by container name
      AUTOGATUS_RESYNC_INTERVAL: "15"
      # Logging
      AUTOGATUS_LOG_FORMAT: text               # text (human) or json (aggregators)
      AUTOGATUS_LOG_LEVEL: INFO                 # DEBUG for per-container detail
      AUTOGATUS_ACCESS_LOG_LEVEL: INFO          # /details request logs; OFF to suppress
      # Container monitoring (opt-in): monitor every container by pushing to Gatus
      # AUTOGATUS_MONITOR_CONTAINERS: "true"
      # AUTOGATUS_GATUS_URL: http://gatus:8080
      # Alert routing: derive the allowlist from Gatus's configured providers, so a
      # label picking an unconfigured provider is dropped with a warning, not fired
      # into the void. The provider itself must be configured in Gatus's alerting:
      # section; labels only pick which configured providers fire.
      # AUTOGATUS_GATUS_CONFIG: /gatus-config   # path to Gatus config (file or dir)
      # AUTOGATUS_ALERT_TYPES: custom           # default channels; unset -> custom
      # Checks: run exec/tcp probes and push the verdict (for headless or
      # network-isolated containers a central Gatus can't reach). exec runs a
      # command IN the container, so it is gated behind this opt-in. Note: the
      # Docker socket grants exec regardless of the :ro mount above.
      # AUTOGATUS_ENABLE_EXEC: "true"           # allow autogatus.check.<id>.exec labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only socket
      - gatus-generated:/output
      # - ./config:/gatus-config:ro            # so autogatus can read alerting: keys
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # A monitored service just wears labels, no central config edit:
  whoami:
    image: traefik/whoami
    labels:
      gatus.enable: "true"
      gatus.web.url: "http://whoami/"
      gatus.web.conditions.0: "[STATUS] == 200"
      gatus.web.conditions.1: "[RESPONSE_TIME] < 300"
      gatus.web.alerts: "custom"     # fire these Gatus providers (must be configured in Gatus)

  # A headless container with no HTTP endpoint: autogatus runs the check and
  # pushes the verdict (needs AUTOGATUS_ENABLE_EXEC=true for exec).
  cloudflare-ddns:
    image: favonia/cloudflare-ddns
    labels:
      autogatus.check.alive.exec: "pgrep -f cloudflare-ddns"   # exit 0 = healthy

volumes:
  gatus-generated:
